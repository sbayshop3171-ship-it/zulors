
log_format upload_audit '$time_iso8601 $request_method $uri status=$status request_length=$request_length';

server {
    listen 80;
         # Replace this with your exact domain
    server_name vapebook.co;
    return 301 https://www.vapebook.co$request_uri;
}

server {
    server_name www.vapebook.co;
    access_log off;
    root /home/wiwu76fo/public_html/public;
    client_max_body_size 100M;
    large_client_header_buffers 4 16k;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Keep these guards in the deployed virtual host. They stop obsolete
    # multipart upload routes before PHP creates upload temporary files.
    location ~ ^/api/(post/editor/media/(image|video|audio|document)/upload|post/editor/media/video/direct/(raw|part)|story/editor/media/upload|settings/account/(avatar|cover)/update|messenger/groups/avatar/update|messenger/audio/[^/]+/upload)$ {
        access_log /var/log/nginx/media_upload_rejected.log upload_audit;
        return 410;
    }

    # Keep onboarding skip requests available while rejecting avatar bodies.
    location = /api/tips/avatar/update {
        access_log /var/log/nginx/media_upload_rejected.log upload_audit;
        if ($http_content_type ~* "^multipart/form-data(;|$)") { return 410; }
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /api/messenger/send {
        access_log /var/log/nginx/media_upload_rejected.log upload_audit;
        if ($http_content_type ~* "^multipart/form-data(;|$)") { return 410; }
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /app {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_pass http://0.0.0.0:9000; # Ensure this matches your Reverb server's host and port
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
		include fastcgi_params;
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

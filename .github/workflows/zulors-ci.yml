name: Zulors CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_live:
        description: Deploy the latest main commit to production after checks pass.
        required: true
        default: false
        type: boolean

concurrency:
  group: zulors-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    name: Build And Check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, intl, json, mbstring, mysql, openssl, pdo, pdo_mysql, pdo_sqlite, tokenizer, xml, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Prepare CI environment
        run: |
          mkdir -p bootstrap/cache storage/frontend storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
          chmod -R 775 bootstrap/cache storage
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's#^APP_URL=.*#APP_URL=http://127.0.0.1:8000#' .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's#^DB_DATABASE=.*#DB_DATABASE=database/database.sqlite#' .env
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=file/' .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          sed -i 's/^BROADCAST_CONNECTION=.*/BROADCAST_CONNECTION=log/' .env
          sed -i 's/^NOTIFICATIONS_BROADCAST_ENABLED=.*/NOTIFICATIONS_BROADCAST_ENABLED=false/' .env
          touch database/database.sqlite

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate app key
        run: php artisan key:generate --ansi

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: |
          npm run build
          rm -f public/hot

      - name: PHP syntax and route preflight
        run: |
          find app bootstrap config database routes public -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php artisan route:list --no-ansi >/dev/null

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Laravel boot check
        run: php artisan about

      - name: Check isolated Messenger staging test configuration
        id: messenger_staging
        env:
          MESSENGER_STAGING_URL: ${{ secrets.MESSENGER_STAGING_URL }}
          MESSENGER_STAGING_USER: ${{ secrets.MESSENGER_STAGING_USER }}
          MESSENGER_STAGING_PASSWORD: ${{ secrets.MESSENGER_STAGING_PASSWORD }}
          MESSENGER_STAGING_SOURCE_CHAT_ID: ${{ secrets.MESSENGER_STAGING_SOURCE_CHAT_ID }}
          MESSENGER_STAGING_DESTINATION_CHAT_ID: ${{ secrets.MESSENGER_STAGING_DESTINATION_CHAT_ID }}
          MESSENGER_STAGING_DESTINATION_CHAT_NAME: ${{ secrets.MESSENGER_STAGING_DESTINATION_CHAT_NAME }}
        run: |
          if [ -n "$MESSENGER_STAGING_URL" ] && [ -n "$MESSENGER_STAGING_USER" ] && [ -n "$MESSENGER_STAGING_PASSWORD" ] && [ -n "$MESSENGER_STAGING_SOURCE_CHAT_ID" ] && [ -n "$MESSENGER_STAGING_DESTINATION_CHAT_ID" ] && [ -n "$MESSENGER_STAGING_DESTINATION_CHAT_NAME" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Isolated Messenger staging secrets are not configured; browser tests are skipped."
          fi

      - name: Install Chromium for staging Messenger checks
        if: steps.messenger_staging.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run staging Messenger browser checks
        if: steps.messenger_staging.outputs.ready == 'true'
        env:
          MESSENGER_E2E_BASE_URL: ${{ secrets.MESSENGER_STAGING_URL }}
          MESSENGER_E2E_USER: ${{ secrets.MESSENGER_STAGING_USER }}
          MESSENGER_E2E_PASSWORD: ${{ secrets.MESSENGER_STAGING_PASSWORD }}
          MESSENGER_E2E_SOURCE_CHAT_ID: ${{ secrets.MESSENGER_STAGING_SOURCE_CHAT_ID }}
          MESSENGER_E2E_DESTINATION_CHAT_ID: ${{ secrets.MESSENGER_STAGING_DESTINATION_CHAT_ID }}
          MESSENGER_E2E_DESTINATION_CHAT_NAME: ${{ secrets.MESSENGER_STAGING_DESTINATION_CHAT_NAME }}
        run: npm run test:e2e

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_live == true
    name: Deploy Live
    needs: build
    runs-on: ubuntu-24.04

    env:
      LIVE_HOST: ${{ secrets.LIVE_HOST }}
      LIVE_USER: ${{ secrets.LIVE_USER }}
      LIVE_PORT: ${{ secrets.LIVE_PORT }}
      LIVE_PATH: ${{ secrets.LIVE_PATH }}
      LIVE_SSH_PRIVATE_KEY: ${{ secrets.LIVE_SSH_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check deploy secrets
        id: deploy_secrets
        run: |
          if [ -n "$LIVE_HOST" ] && [ -n "$LIVE_USER" ] && [ -n "$LIVE_PATH" ] && [ -n "$LIVE_SSH_PRIVATE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets are not configured. Build stays green; live deploy is skipped."
          fi

      - name: Install SSH key
        if: steps.deploy_secrets.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$LIVE_SSH_PRIVATE_KEY" > ~/.ssh/zulors_live_deploy
          chmod 600 ~/.ssh/zulors_live_deploy

      - name: Deploy to live server
        if: steps.deploy_secrets.outputs.ready == 'true'
        env:
          LIVE_SSH_KEY: ~/.ssh/zulors_live_deploy
          LIVE_PORT: ${{ secrets.LIVE_PORT || '22' }}
        run: bash deploy/rsync-live.sh

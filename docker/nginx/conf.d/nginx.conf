log_format upload_audit '$time_iso8601 $request_method $uri status=$status request_length=$request_length';

server {
	listen 80;
	server_name localhost;
	root /var/www/html/public;

	client_max_body_size 4G;
	client_header_buffer_size 1k;
	large_client_header_buffers 4 16k;

	# 2 hours timeout
	proxy_read_timeout 7200s;
    proxy_connect_timeout 7200s;
    proxy_send_timeout 7200s;
    send_timeout 7200s;
    fastcgi_read_timeout 300;

	add_header X-Frame-Options "SAMEORIGIN";
	add_header X-XSS-Protection "1; mode=block";
	add_header X-Content-Type-Options "nosniff";

	index index.html index.htm index.php;

	charset utf-8;

    location ~* ^/storage/.*\.(php|phtml|php5|php7)$ {
        deny all;
        return 404;
    }

    location ~ /\.(env|git) {
        deny all;
        return 404;
    }

	location / {
		try_files $uri $uri/ /index.php?$query_string;
	}

	# Obsolete upload receivers must stop before PHP parses multipart bodies into
	# upload_tmp_dir. The current client sends only JSON metadata to the API and
	# sends media bytes directly to the signed R2 URL.
	location ~ ^/api/(post/editor/media/(image|video|audio|document)/upload|post/editor/media/video/direct/(raw|part)|story/editor/media/upload|settings/account/(avatar|cover)/update|messenger/groups/avatar/update|messenger/audio/[^/]+/upload)$ {
		access_log /var/log/nginx/media_upload_rejected.log upload_audit;
		return 410;
	}

	# Onboarding allows a JSON/form skip action on this endpoint. Reject only
	# file bodies; non-upload skip requests still reach Laravel.
	location = /api/tips/avatar/update {
		access_log /var/log/nginx/media_upload_rejected.log upload_audit;
		if ($http_content_type ~* "^multipart/form-data(;|$)") { return 410; }
		try_files $uri $uri/ /index.php?$query_string;
	}

	# Chat text still uses this endpoint, but legacy multipart attachments are
	# rejected before they can create PHP temporary files.
	location = /api/messenger/send {
		access_log /var/log/nginx/media_upload_rejected.log upload_audit;
		if ($http_content_type ~* "^multipart/form-data(;|$)") { return 410; }
		try_files $uri $uri/ /index.php?$query_string;
	}

	location /app {
        # Uncomment this to enable logging
		#access_log /var/log/nginx/zulors_ws_access.log;
		#error_log /var/log/nginx/zulors_ws_error.log debug;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_pass http://reverb:13000;

		# Ensure this matches your Reverb server's host and port
    }

	location = /favicon.ico { access_log off; log_not_found off; }
	location = /robots.txt  { access_log off; log_not_found off; }

	error_page 404 /index.php;

	location ~ \.php$ {
		try_files $uri =404;
		fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # Change your PHP version to the one you are using.
        # Sometimes socket files are located in different locations.
        # check your php version and socket file location.

		#fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
		fastcgi_pass zulors:9000;
		fastcgi_index index.php;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param PATH_INFO $fastcgi_path_info;
	}

	location ~* \.(jpg|jpeg|gif|png|css|js|ico|svg|woff|woff2|ttf|otf|eot|ttf|ttc|map|mp4|webm|ogg|ogv|webp|zip|rar|tar|gz|bz2|7z)$ {
		expires max;
		log_not_found off;
	}
}
